
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <title>Login — TodoList Platform</title>
  
  <script>
    (function() {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();
    function toggleTheme() {
      const dark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      document.getElementById('theme-btn').textContent = dark ? '☀' : '☾';
    }
  </script>

  <style>
    
    :root {
      --bg:           #f0f2f5;
      --card-bg:      #ffffff;
      --text:         #1e293b;
      --text-muted:   #94a3b8;
      --border:       #e2e8f0;
      --border-light: #f1f5f9;
      --th-bg:        #f8fafc;
      --th-color:     #64748b;
      --hover-bg:     #f1f5f9;
      --current-row:  #ede9fe;
      --input-bg:     #ffffff;
      --label-color:  #475569;
      --error-bg:     #fef2f2;
      --error-color:  #dc2626;
      --error-border: #fecaca;
    }
    .dark {
      --bg:           #0f172a;
      --card-bg:      #1e293b;
      --text:         #e2e8f0;
      --text-muted:   #64748b;
      --border:       #334155;
      --border-light: #273344;
      --th-bg:        #162032;
      --th-color:     #94a3b8;
      --hover-bg:     #273344;
      --current-row:  #2d1f4e;
      --input-bg:     #0f172a;
      --label-color:  #94a3b8;
      --error-bg:     #2d1215;
      --error-color:  #f87171;
      --error-border: #7f1d1d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 360px;
      overflow: hidden;
    }
    .card-header {
      background: #2563eb;
      padding: 24px 28px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }
    .card-header h1 { color: #fff; font-size: 1.3rem; font-weight: 600; }
    .card-header p  { color: rgba(255,255,255,0.75); font-size: 0.82rem; margin-top: 4px; }
    .theme-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 0.85rem;
      align-self: center;
    }
    .card-body { padding: 28px; }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--label-color);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: var(--input-bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: #2563eb; }
    .error {
      background: var(--error-bg);
      color: var(--error-color);
      border: 1px solid var(--error-border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    button[type=submit] {
      width: 100%;
      padding: 11px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button[type=submit]:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div>
        <h1>TodoList Platform</h1>
        <p>Sign in to continue</p>
      </div>
      <button id="theme-btn" class="theme-btn" onclick="toggleTheme()">☾</button>
    </div>
    <div class="card-body">
      
      <form method="POST" action="/login">
        <div class="field">
          <label>Username</label>
          <input name="username" type="text" autocomplete="username" autofocus>
        </div>
        <div class="field">
          <label>Password</label>
          <input name="password" type="password" autocomplete="current-password">
        </div>
        <button type="submit">Sign in</button>
      </form>
    </div>
  </div>
  <script>
    document.getElementById('theme-btn').textContent =
      document.documentElement.classList.contains('dark') ? '☀' : '☾';
  </script>
</body>
</html>
