# Secret da aplicação todolist.
# A imagem é construída com os valores default (admin/admin123).
# Em produção, use SealedSecrets ou External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: todolist-secrets
  namespace: todolist
type: Opaque
stringData:
  DB_USER: "todolist"
  DB_PASSWORD: "todolistpw"
  SESSION_KEY: "change-this-session-key"
  ADMIN_USER: "admin"
  ADMIN_PASSWORD: "admin123"
  CLEANUP_TOKEN: "cleanup-token-local"
