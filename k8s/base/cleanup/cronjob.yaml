# CronJob de limpeza — consolida todo obsoleto/expirado via endpoint /cleanup
apiVersion: batch/v1
kind: CronJob
metadata:
  name: todolist-cleanup
  namespace: todolist
  labels:
    app.kubernetes.io/name: todolist
    app.kubernetes.io/component: cleanup
    app.kubernetes.io/part-of: todolist
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: todolist
          containers:
            - name: cleanup
              image: curlimages/curl:latest
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                - |
                  echo "Cleanup started at $(date)"
                  TOKEN="${CLEANUP_TOKEN:-}"
                  if [ -n "$TOKEN" ]; then
                    curl -sf -X POST \
                      -H "X-Cleanup-Token: $TOKEN" \
                      -H "Content-Type: application/json" \
                      "http://todolist.todolist.svc.cluster.local:5000/cleanup" || echo "Cleanup request failed (non-critical)"
                  else
                    echo "No CLEANUP_TOKEN configured; skipping cleanup request"
                  fi
                  echo "Cleanup finished"
              env:
                - name: CLEANUP_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: todolist-secrets
                      key: CLEANUP_TOKEN
