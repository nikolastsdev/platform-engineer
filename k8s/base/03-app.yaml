apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist
  namespace: todolist
  labels:
    app: todolist
    tier: frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: todolist
  template:
    metadata:
      labels:
        app: todolist
        tier: frontend
    spec:
      serviceAccountName: todolist
      containers:
        - name: todolist
          image: localhost:5000/todolist:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: todolist-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: todolist-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todolist-secrets
                  key: DB_PASSWORD
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: todolist-secrets
                  key: SESSION_KEY
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: todolist-secrets
                  key: ADMIN_USER
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todolist-secrets
                  key: ADMIN_PASSWORD
            - name: CLEANUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: todolist-secrets
                  key: CLEANUP_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: todolist
  namespace: todolist
  labels:
    app: todolist
spec:
  type: NodePort
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30000
      nodePort: 30000
      protocol: TCP
  selector:
    app: todolist
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: todolist-hpa
  namespace: todolist
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: todolist
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
