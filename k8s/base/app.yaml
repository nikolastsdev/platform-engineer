# ==============================================================================
# Application Deployment — TodoList Flask API
# ==============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist
  namespace: todolist
  labels:
    app.kubernetes.io/name: todolist
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: todolist
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: todolist
  template:
    metadata:
      labels:
        app.kubernetes.io/name: todolist
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: todolist
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      serviceAccountName: todolist
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/nikolastsdev/platform-engineer/todolist:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: todolist-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: todolist-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todolist-secrets
                  key: DB_PASSWORD
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: todolist-secrets
                  key: SESSION_KEY
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: todolist-secrets
                  key: ADMIN_USER
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todolist-secrets
                  key: ADMIN_PASSWORD
            - name: CLEANUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: todolist-secrets
                  key: CLEANUP_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

---
apiVersion: v1
kind: Service
metadata:
  name: todolist
  namespace: todolist
  labels:
    app.kubernetes.io/name: todolist
    app.kubernetes.io/component: api
spec:
  type: NodePort
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30000
      protocol: TCP
  selector:
    app.kubernetes.io/name: todolist

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: todolist
  namespace: todolist
  labels:
    app.kubernetes.io/name: todolist
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: todolist
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
