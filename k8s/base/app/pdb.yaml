# PodDisruptionBudget — garante pelo menos 1 pod disponível durante updates
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: todolist
  namespace: todolist
  labels:
    app.kubernetes.io/name: todolist
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: todolist
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: todolist
