# Kustomize base — manifests da aplicação todolist sincronizados pelo ArgoCD
# Ordem semântica declarativa (sem prefixos numéricos):
# namespaces → secrets/config → database → app → ingress/rbac/network → cleanup
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace-app.yaml
  - namespace-database.yaml
  - secrets.yaml
  - configmap.yaml
  - postgresql.yaml
  - app.yaml
  - ingress.yaml
  - rbac.yaml
  - cleanup-cronjob.yaml
  - ghcr-pull-secret.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: todolist
      app.kubernetes.io/environment: kind-local
    includeSelectors: false
