# Kustomize base — arquitetura clean por camadas
# Fonte única de verdade para o GitOps (ArgoCD sync).
# Ordem semântica declarativa (sem prefixos numéricos):
# namespace → config → database → app → network → cleanup
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace/namespace-app.yaml
  - namespace/namespace-database.yaml
  - config/configmap.yaml
  - config/secret.yaml
  - config/ghcr-pull-secret.yaml
  - database/postgresql.yaml
  - app/deployment.yaml
  - app/hpa.yaml
  - app/pdb.yaml
  - network/service.yaml
  - network/ingress.yaml
  - network/rbac.yaml
  - cleanup/cronjob.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: todolist
      app.kubernetes.io/environment: kind-local
    includeSelectors: false
