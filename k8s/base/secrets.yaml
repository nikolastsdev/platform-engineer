# Secrets da aplicação todolist.
# Em produção, use SealedSecrets ou External Secrets Operator.
---
# GHCR image pull secret — gere com:
#   GH_TOKEN=$(gh auth token)
#   kubectl create secret docker-registry ghcr-pull \
#     -n todolist --docker-server=ghcr.io \
#     --docker-username=nikolastsdev --docker-password="$GH_TOKEN" \
#     --dry-run=client -o yaml | yq -y . > ghcr-pull-secret.yaml
# Depois adicione ghcr-pull-secret.yaml aos resources do kustomization.yaml
apiVersion: v1
kind: Secret
metadata:
  name: todolist-secrets
  namespace: todolist
type: Opaque
stringData:
  DB_USER: "todolist"
  DB_PASSWORD: "todolistpw"
  SESSION_KEY: "change-this-session-key"
  ADMIN_USER: "admin"
  ADMIN_PASSWORD: "admin123"
  CLEANUP_TOKEN: "cleanup-token-local"
