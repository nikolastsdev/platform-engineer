apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todolist-app.fullname" . }}-env
  labels:
    app.kubernetes.io/name: {{ include "todolist-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
