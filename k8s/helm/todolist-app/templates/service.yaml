apiVersion: v1
kind: Service
metadata:
  name: {{ include "todolist-app.fullname" . }}
  labels:
    {{- include "todolist-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort | default "http" }}
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "todolist-app.selectorLabels" . | nindent 4 }}
