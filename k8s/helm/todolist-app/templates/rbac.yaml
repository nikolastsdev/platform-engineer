{{- if and .Values.serviceAccount.create ((.Values.rbac).enabled | default true) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "todolist-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "todolist-app.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "todolist-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "todolist-app.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "todolist-app.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "todolist-app.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
