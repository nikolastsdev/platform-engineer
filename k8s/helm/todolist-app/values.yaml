# ==============================================================================
# Valores default para o chart todolist-app
# ==============================================================================
image:
  repository: localhost:5000/todolist
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: localhost
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

env:
  APP_NAME: "TodoList"
  APP_COLOR: "purple"
  APP_PORT: "5000"
  LOG_LEVEL: "info"
  DB_HOST: "postgresql.todolist-db.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "todolist"

secrets:
  dbUser: todolist
  dbPassword: todolistpw
  sessionKey: "change-me-in-production"
  adminUser: admin
  adminPassword: admin123
  cleanupToken: "cleanup-token-local"

serviceAccount:
  create: true
  name: todolist-app

rbac:
  enabled: true

cleanupCronjob:
  enabled: true
  schedule: "*/5 * * * *"
  image:
    repository: curlimages/curl
    tag: latest
