name: Build and Push
on: push: branches: [main]
jobs: build: runs-on: ubuntu-latest, steps: - uses: actions/checkout@v4, - name: Build - run: docker build . -t ghcr.io/nikolastsdev/platform-engineer/todolist:${{ github.sha }}; echo ${{ github.sha }} > /tmp/hash, - name: Push - run: echo ${{ secrets.GH_TOKEN }} | docker login ghcr.io -u nikolastsdev --password-stdin; docker push ghcr.io/nikolastsdev/platform-engineer/todolist:${{ github.sha }}
# Após push: atualizar app.yaml com digest e commitar (ArgoCD sync automático)
