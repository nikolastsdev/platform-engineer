# ==============================================================================
# Pipeline do app — roda nos runners hosted do GitHub
#
# Resumo:
#   PR/push  → test (Python + Postgres)
#   push main → build + push imagem ao GitHub Packages (GHCR) + scan (Trivy)
#   deploy  → atualiza o manifest de imagem no repo GitOps (argo-test-manifests),
#             que o ArgoCD aplica automaticamente (GitOps)
# ==============================================================================
name: App CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: todolist
  IMAGE_REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  # Imagem publicada no GitHub Packages (GHCR) — sem registry local
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/todolist
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Testes da aplicação (Python + PostgreSQL)
  # -----------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: todolist
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: todolist
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        working-directory: todolist-app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: App import check
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: todolist
          DB_USER: todolist
          DB_PASSWORD: testpass
        working-directory: todolist-app
        run: python -c "from app import app; print('App imports OK')"

  # -----------------------------------------------------------------------
  # Job 2: Build + push da imagem para o GitHub Packages (GHCR)
  # -----------------------------------------------------------------------
  build:
    name: Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push imagem
        uses: docker/build-push-action@v6
        with:
          context: todolist-app
          file: todolist-app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:latest

  # -----------------------------------------------------------------------
  # Job 3: Security scan (Trivy)
  # -----------------------------------------------------------------------
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE }}:${{ env.IMAGE_TAG }}'
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  # -----------------------------------------------------------------------
  # Job 4: Deploy via GitOps — atualiza o manifest de imagem no repo de
  # manifests (argo-test-manifests); o ArgoCD auto-sync aplica no cluster.
  # -----------------------------------------------------------------------
  deploy:
    name: Deploy (GitOps)
    runs-on: ubuntu-latest
    needs: scan
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar imagem no repo GitOps
        if: env.GITOPS_REPO != '' && env.GITOPS_TOKEN != ''
        run: |
          set -eu
          REPO="$GITOPS_REPO"
          WORK="$(mktemp -d)"
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/${REPO}.git" "$WORK"
          cd "$WORK"

          # Fixa o manifest da app para a imagem GHCR com a tag por SHA.
          # O ArgoCD detecta a mudança e faz o auto-sync (deploy GitOps).
          MANIFEST="k8s/base/03-app.yaml"
          grep -q "image:" "$MANIFEST"
          sed -i -E "s#image: .*/todolist:[^ ]*#image: ${IMAGE}:${IMAGE_TAG}#" "$MANIFEST"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Manifest já aponta para $IMAGE_TAG — nada a commitar."
          else
            git -c commit.gpgsign=false commit -m "chore: atualiza imagem todolist para $IMAGE_TAG [skip ci]"
            git push origin HEAD:main
          fi
          rm -rf "$WORK"
