# ==============================================================================
# Kind Cluster Configuration
# Cluster local para o Platform Engineer Challenge
# - 1 control-plane + 3 workers
# - Portas 80/443 mapeadas para o host (acesso via http://localhost)
# - containerdConfigPatches: mirror do registry local (localhost:5000 ->
#   kind-registry:5000) para os pods puxarem as imagens construídas localmente
# ==============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
      endpoint = ["http://kind-registry:5000"]

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: 0.0.0.0
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: 0.0.0.0
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
