# ==============================================================================
# Kind Cluster Configuration
# Cluster local para o Platform Engineer Challenge
# - 1 control-plane + 3 workers
# - Portas 80/443 mapeadas para o host (acesso via http://localhost)
# A imagem da aplicação vem do GitHub Packages (GHCR), puxada via imagePullSecret.
# ==============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: todolist-platform

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: 0.0.0.0
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: 0.0.0.0
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
